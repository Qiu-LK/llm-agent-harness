[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness"
version = "0.6.0"
description = "A small, observable agent harness that connects directly to DeepSeek."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
deepseek-harness = "deepseek_harness.cli:main"
deepseek-eval = "deepseek_harness.evals:main"
deepseek-report = "deepseek_harness.reporting:main"
deepseek-web = "deepseek_harness.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepseek_harness = ["web_assets/templates/*.html", "web_assets/static/*.css", "web_assets/static/*.js"]
